<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MockAPI-Studio | Zero-Dependency REST Mock Server</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-group">
        <span class="logo-icon">🚀</span>
        <div>
          <h1>MockAPI-Studio</h1>
          <p class="subtitle">Zero-dependency REST API Mock Server & Schema Studio</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="delay-control">
          <label for="delayInput">Delay:</label>
          <input type="number" id="delayInput" min="0" max="5000" step="100" value="0"> ms
        </div>
        <button id="resetDbBtn" class="btn btn-outline btn-sm">Reset Sample DB</button>
        <span class="badge">Port 3017</span>
      </div>
    </header>

    <main class="studio-layout">
      <!-- Left Panel: Collection Navigator -->
      <section class="card sidebar-panel">
        <div class="panel-header">
          <h2>Collections</h2>
          <button id="addCollectionBtn" class="btn btn-primary btn-sm">+ New</button>
        </div>
        <div id="collectionsList" class="collections-list">
          <div class="loading-spinner">Loading schemas...</div>
        </div>
      </section>

      <!-- Right Panel: Data Editor & Endpoint Test Console -->
      <section class="card main-panel">
        <div id="editorHeader" class="editor-header">
          <div class="collection-title-group">
            <h2 id="currentCollectionTitle">Select a collection</h2>
            <code id="currentEndpointUrl">http://localhost:3017/api/...</code>
          </div>
          <div class="header-btns">
            <button id="addItemBtn" class="btn btn-primary btn-sm">+ Add Record</button>
          </div>
        </div>

        <div id="testConsole" class="test-console">
          <div class="section-title">Endpoint Test Console</div>
          <div class="test-bar">
            <select id="testMethod">
              <option value="GET">GET</option>
              <option value="POST">POST</option>
              <option value="PUT">PUT</option>
              <option value="DELETE">DELETE</option>
            </select>
            <input type="text" id="testUrl" placeholder="/api/users">
            <button id="sendTestBtn" class="btn btn-primary">Send Request</button>
          </div>
          <div class="test-params">
            <input type="text" id="testQuery" placeholder="Query params (e.g. ?q=alice&_sort=id&_order=desc)">
          </div>
        </div>

        <div class="section-title">Collection Records (JSON)</div>
        <pre id="jsonViewer" class="json-viewer">Select a collection to view and edit JSON records.</pre>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
